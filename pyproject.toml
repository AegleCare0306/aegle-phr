[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegle-phr"
version = "0.1.0"
description = "Patient-facing ABDM PHR app. Mountable into the Aegle ABDM backend's process, or runnable standalone for development."
requires-python = ">=3.12"

dependencies = [
    # The shared ABDM plumbing. Installed from the sibling checkout in
    # development (pip install -e ../aegle-abdm-core); not published, so it
    # is deliberately NOT version-pinned here.
    "aegle-abdm-core",

    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic-settings>=2.6",

    # Sync SQLAlchemy + the SYNC psycopg 3 driver. Not asyncpg -- see
    # aegle_phr/db.py for why every handler in this app is a plain `def`.
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Needed only by FastAPI's TestClient, which is what the offline
# verification uses to exercise routes without binding a port.
dev = ["httpx>=0.27"]

[project.scripts]
aegle-phr = "aegle_phr.__main__:main"

[tool.setuptools.packages.find]
include = ["aegle_phr*"]
